services:
  - type: web
    name: smart-library
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn library_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: false
